name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ONNX Runtime
        run: bash scripts/setup_onnxruntime.sh --gpu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-targets --verbose

      - name: Run tests
        run: cargo test --workspace --all-targets --verbose

      - name: Run doc-tests
        run: cargo test --workspace --doc --verbose

  release:
    name: Build Release Artifacts (${{ matrix.platform }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ONNX Runtime
        run: bash scripts/setup_onnxruntime.sh --gpu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --workspace

      - name: Package Release Binary
        run: |
          DIST_DIR=$(mktemp -d)
          echo "DIST_DIR=${DIST_DIR}" >> "$GITHUB_ENV"
          tar -czvf "${DIST_DIR}/wiggle-3d-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" -C target/release reto-cli

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiggle-3d-${{ github.ref_name }}-${{ matrix.platform }}
          path: ${{ env.DIST_DIR }}/wiggle-3d-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST_DIR }}/*
          generate_release_notes: true
          draft: true



